name: check

# The same gate as `just check` (format, lint, typecheck, tests, build) on all three desktop systems, plus
# the NAS Docker image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t puffinote:ci .
      - name: Smoke test
        run: |
          docker run -d --name pn -p 8790:8790 puffinote:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8790/api/info && exit 0; sleep 1; done
          docker logs pn
          exit 1
