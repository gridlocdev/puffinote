<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puffinote editor</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        font: 13px system-ui;
        border-bottom: 1px solid #8884;
      }
      .bar button[aria-pressed='true'] {
        font-weight: 700;
      }
      .host {
        flex: 1;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
