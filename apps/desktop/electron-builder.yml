appId: dev.gridloc.puffinote
productName: Puffinote
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # The window icon on Linux and Windows (macOS takes the bundle's icon.icns).
  - build/icon.png
asar: true
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature, so Apple silicon will run a local build. Swap for a Developer ID to distribute.
  identity: '-'
linux:
  target: [AppImage]
  category: Office
win:
  target: [nsis]
