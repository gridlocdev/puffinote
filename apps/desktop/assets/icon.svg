<?xml version="1.0" encoding="UTF-8"?>
<!-- Puffinote's app icon. 1024 canvas on Apple's icon grid: an 824-unit tile at (100,100) with a
     transparent margin. scripts/make-icons.sh crops to the tile for Windows and Linux, so keep the
     tile there. A white puffin in profile, facing left, traced from a photo (in the photo's pixel
     coordinates, scaled by the group's transform); the beak's stripes and the eye are gaps. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#6FA8FF" />
      <stop offset="1" stop-color="#2B5FCC" />
    </linearGradient>
    <clipPath id="tileShape">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
    <mask id="cuts" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF" />
      <g fill="none" stroke="#000000" stroke-width="10" stroke-linecap="butt">
        <!-- Between the beak and the face. -->
        <path d="M 176 36 C 173.3 42.7 164.3 62.7 160 76 C 155.7 89.3 151.3 102.0 150 116 C 148.7 130.0 149.7 146.7 152 160 C 154.3 173.3 160.3 187.0 164 196 C 167.7 205.0 172.3 211.0 174 214" />
        <!-- The stripes across the beak. -->
        <path d="M 136 70 C 133.7 76.7 125.0 95.0 122 110 C 119.0 125.0 118.3 145.0 118 160 C 117.7 175.0 119.0 185.0 120 200 C 121.0 215.0 123.3 241.7 124 250" />
        <path d="M 108 96 C 106.0 101.7 98.7 117.7 96 130 C 93.3 142.3 92.7 150.0 92 170 C 91.3 190.0 92.0 236.7 92 250" />
      </g>
      <!-- The eye. -->
      <circle cx="196" cy="103" r="12" fill="#000000" />
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" />

  <!-- The bird runs off the bottom right of the tile, cropped like the photo. -->
  <g clip-path="url(#tileShape)">
    <g transform="matrix(2.15 0 0 2.15 62 143)" fill="#FFFFFF" mask="url(#cuts)">
      <path d="M 64 234 C 64.3 228.3 64.7 210.8 66 200 C 67.3 189.2 69.0 178.2 72 169 C 75.0 159.8 80.0 151.8 84 145 C 88.0 138.2 92.0 133.3 96 128 C 100.0 122.7 104.0 118.0 108 113 C 112.0 108.0 116.0 102.7 120 98 C 124.0 93.3 128.0 89.5 132 85 C 136.0 80.5 140.0 75.5 144 71 C 148.0 66.5 152.0 61.5 156 58 C 160.0 54.5 163.0 52.7 168 50 C 173.0 47.3 179.3 44.2 186 42 C 192.7 39.8 200.3 38.0 208 37 C 215.7 36.0 224.0 35.2 232 36 C 240.0 36.8 248.0 38.7 256 42 C 264.0 45.3 272.7 50.3 280 56 C 287.3 61.7 294.0 68.7 300 76 C 306.0 83.3 311.3 92.0 316 100 C 320.7 108.0 325.3 115.7 328 124 C 330.7 132.3 331.0 139.8 332 150 C 333.0 160.2 333.0 175.0 334 185 C 335.0 195.0 335.0 202.8 338 210 C 341.0 217.2 345.0 221.8 352 228 C 359.0 234.2 368.7 240.3 380 247 C 391.3 253.7 405.0 259.2 420 268 C 435.0 276.8 461.7 274.7 470 300 C 478.3 325.3 528.7 400.0 470 420 C 411.3 440.0 173.7 433.3 118 420 C 62.3 406.7 129.7 362.3 136 340 C 142.3 317.7 150.7 303.3 156 286 C 161.3 268.7 165.0 248.0 168 236 C 171.0 224.0 173.0 217.7 174 214 L 174 214 C 171.7 214.8 165.7 217.3 160 219 C 154.3 220.7 147.3 222.5 140 224 C 132.7 225.5 124.0 226.7 116 228 C 108.0 229.3 99.3 230.8 92 232 C 84.7 233.2 76.7 234.7 72 235 C 67.3 235.3 65.3 234.2 64 234 Z" />
    </g>
  </g>
</svg>
